services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ecornance-db
    volumes:
      - db-data:/var/lib/postgresql/data
  rembg:
    image: danielgatis/rembg
    ports:
      - "7000:7000"
    volumes:
      - ./data/:/root
    command: ["s","--no-ui" ,"--host", "0.0.0.0", "--port", "7000"]
    restart: unless-stopped
    network_mode: "bridge"
volumes:
  db-data: